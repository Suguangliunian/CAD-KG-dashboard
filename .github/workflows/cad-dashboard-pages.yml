name: Deploy CAD dashboard

on:
  push:
    branches: [main]
    paths:
      - 'cad_dashboard/**'
      - '.github/workflows/cad-dashboard-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate data and summary rules
        run: node --test cad_dashboard/tests/data-model.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: cad_dashboard
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
